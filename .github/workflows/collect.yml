name: Collect Scam Articles

on:
  schedule:
    # KST 00:00, 06:00, 12:00, 18:00
    - cron: "0 15,21,3,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scam-data-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect raw articles
        run: python scam_data_pipeline.py collect --limit 20 --verbose

      - name: Commit collected data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/raw_articles.jsonl
          if git diff --cached --quiet; then
            echo "No new raw articles to commit."
          else
            git commit -m "Collect scam articles"
            git pull --rebase
            git push
          fi
